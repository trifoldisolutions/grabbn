<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grabbn — Dev To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind/output.css" />
  <style>
    .tag-pill { cursor: pointer; user-select: none; }
    .tag-pill.active-filter { outline: 2px solid; outline-offset: 1px; }
  </style>
</head>
<body class="bg-woodsmoke-950 text-woodsmoke-100 font-sans min-h-screen py-12 px-6">

  <div class="max-w-2xl mx-auto">

    <!-- Add form -->
    <form id="add-form" class="flex flex-col gap-2 mb-6">
      <div class="flex gap-2">
        <input id="task-input" type="text" placeholder="Add a new task..." autocomplete="off"
          class="flex-1 bg-silver-950 border border-woodsmoke-800 rounded-lg px-4 py-2.5 text-base text-woodsmoke-100 placeholder-woodsmoke-500 outline-none focus:border-orchid-600 transition-colors" />
        <button type="submit"
          class="bg-orchid-600 hover:bg-orchid-500 text-white text-base font-semibold px-5 py-2.5 rounded-lg transition-colors whitespace-nowrap">
          Add task
        </button>
      </div>
      <textarea id="desc-input" placeholder="Description (optional)" rows="2" autocomplete="off"
        class="bg-silver-950 border border-woodsmoke-800 rounded-lg px-4 py-2 text-sm text-woodsmoke-100 placeholder-woodsmoke-500 outline-none focus:border-orchid-600 transition-colors resize-none"></textarea>
      <input id="tags-input" type="text" placeholder="Tags (comma separated — e.g. backend, api)" autocomplete="off"
        class="bg-silver-950 border border-woodsmoke-800 rounded-lg px-4 py-2 text-sm text-woodsmoke-100 placeholder-woodsmoke-500 outline-none focus:border-orchid-600 transition-colors" />
    </form>

    <!-- Status filters + stats -->
    <div class="flex items-center justify-between mb-3">
      <div class="flex gap-2" id="status-filters">
        <button data-filter="all"     class="filter-btn active text-sm px-3 py-1 rounded-md border border-orchid-600 text-orchid-400 transition-colors">All</button>
        <button data-filter="pending" class="filter-btn text-sm px-3 py-1 rounded-md border border-woodsmoke-800 text-woodsmoke-500 hover:border-orchid-600 hover:text-orchid-400 transition-colors">Pending</button>
        <button data-filter="done"    class="filter-btn text-sm px-3 py-1 rounded-md border border-woodsmoke-800 text-woodsmoke-500 hover:border-orchid-600 hover:text-orchid-400 transition-colors">Completed</button>
      </div>
      <p id="stats" class="text-sm text-woodsmoke-500"></p>
    </div>

    <!-- Tag filter cloud -->
    <div id="tag-cloud" class="flex flex-wrap gap-1.5 mb-5"></div>

    <!-- Task list -->
    <div id="task-list" class="flex flex-col gap-2"></div>

  </div>

  <template id="task-tpl">
    <div class="task-row group flex items-start gap-3 bg-silver-950 border border-woodsmoke-800 rounded-xl p-3 hover:border-woodsmoke-700 transition-colors">
      <button class="btn-check mt-0.5 w-5 h-5 rounded-full border-2 border-woodsmoke-700 shrink-0 flex items-center justify-center hover:border-orchid-500 transition-colors">
        <svg class="check-icon hidden w-2.5 h-2.5" viewBox="0 0 11 9" fill="none">
          <path d="M1 4L4 7L10 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="task-body flex-1 min-w-0">
        <p class="task-name text-[1.1rem] font-bold leading-snug wrap-break-word"></p>
        <p class="task-desc text-sm text-woodsmoke-200 leading-relaxed mt-1 wrap-break-word whitespace-pre-wrap"></p>
        <div class="task-tags flex flex-wrap gap-1 mt-1.5"></div>
        <div class="task-meta flex gap-4 mt-1 flex-wrap">
          <span class="created-label text-sm text-woodsmoke-500 flex items-center gap-1">
            <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span class="created-val"></span>
          </span>
          <span class="completed-label hidden text-sm text-green-400 flex items-center gap-1">
            <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
            <span class="completed-val"></span>
          </span>
        </div>
        <div class="edit-zone hidden mt-2 flex flex-col gap-2">
          <input class="edit-input bg-woodsmoke-950 border border-orchid-600 rounded-md px-2.5 py-1 text-base text-woodsmoke-100 w-full outline-none" />
          <textarea class="edit-desc-input bg-woodsmoke-950 border border-woodsmoke-700 rounded-md px-2.5 py-1 text-sm text-woodsmoke-100 w-full outline-none placeholder-woodsmoke-500 focus:border-orchid-600 transition-colors resize-none" rows="3" placeholder="Description (optional)"></textarea>
          <input class="edit-tags-input bg-woodsmoke-950 border border-woodsmoke-700 rounded-md px-2.5 py-1 text-sm text-woodsmoke-100 w-full outline-none placeholder-woodsmoke-500 focus:border-orchid-600 transition-colors" placeholder="Tags (comma separated)" />
          <div class="flex gap-2">
            <button class="btn-save text-sm border border-orchid-600 text-orchid-400 hover:bg-orchid-950 px-3 py-1 rounded-md transition-colors">Save</button>
            <button class="btn-cancel text-sm border border-woodsmoke-800 text-woodsmoke-500 hover:text-woodsmoke-100 px-3 py-1 rounded-md transition-colors">Cancel</button>
          </div>
        </div>
      </div>
      <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
        <button class="btn-edit w-7 h-7 flex items-center justify-center rounded-md text-woodsmoke-500 hover:bg-woodsmoke-800 hover:text-woodsmoke-100 transition-colors">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-delete w-7 h-7 flex items-center justify-center rounded-md text-woodsmoke-500 hover:bg-red-950 hover:text-red-400 transition-colors">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </div>
  </template>

  <script>
    const API = '/api/dev/todos';
    let tasks      = [];
    let filter     = 'all';
    let activeTags = new Set();

    const TAG_COLORS = {
      'admin-panel':  { bg: 'bg-orchid-950',   text: 'text-orchid-300',   outline: '#943792' },
      'partnership':  { bg: 'bg-blue-950',      text: 'text-blue-300',     outline: '#3b82f6' },
      'repositories': { bg: 'bg-emerald-950',   text: 'text-emerald-300',  outline: '#10b981' },
      'credits':      { bg: 'bg-yellow-950',    text: 'text-yellow-300',   outline: '#eab308' },
      'explore':      { bg: 'bg-pink-950',      text: 'text-pink-300',     outline: '#ec4899' },
      'security':     { bg: 'bg-red-950',       text: 'text-red-300',      outline: '#ef4444' },
      'extension':    { bg: 'bg-indigo-950',    text: 'text-indigo-300',   outline: '#6366f1' },
      'settings':     { bg: 'bg-teal-950',      text: 'text-teal-300',     outline: '#14b8a6' },
      'transactions': { bg: 'bg-orange-950',    text: 'text-orange-300',   outline: '#f97316' },
      'contact':      { bg: 'bg-cyan-950',      text: 'text-cyan-300',     outline: '#06b6d4' },
      'search':       { bg: 'bg-violet-950',    text: 'text-violet-300',   outline: '#8b5cf6' },
      'backend':      { bg: 'bg-woodsmoke-900', text: 'text-woodsmoke-300', outline: '#4f4f4f' },
      'frontend':     { bg: 'bg-woodsmoke-900', text: 'text-woodsmoke-300', outline: '#4f4f4f' },
      'model':        { bg: 'bg-woodsmoke-900', text: 'text-woodsmoke-300', outline: '#4f4f4f' },
      'api':          { bg: 'bg-woodsmoke-900', text: 'text-woodsmoke-300', outline: '#4f4f4f' },
      'ui':           { bg: 'bg-woodsmoke-900', text: 'text-woodsmoke-300', outline: '#4f4f4f' },
    };
    const DEFAULT_COLOR = { bg: 'bg-silver-900', text: 'text-silver-300', outline: '#525252' };

    function tagColor(tag) { return TAG_COLORS[tag] ?? DEFAULT_COLOR; }

    function buildTagPill(tag, clickable = false) {
      const c  = tagColor(tag);
      const el = document.createElement('span');
      el.textContent = tag;
      el.className = `tag-pill text-sm px-2 py-0.5 rounded-md font-medium ${c.bg} ${c.text}`;
      if (clickable) {
        el.title = `Filter by "${tag}"`;
        if (activeTags.has(tag)) { el.classList.add('active-filter'); el.style.outlineColor = c.outline; }
        el.addEventListener('click', () => toggleTagFilter(tag));
      }
      return el;
    }

    function toggleTagFilter(tag) {
      activeTags.has(tag) ? activeTags.delete(tag) : activeTags.add(tag);
      renderTagCloud();
      render();
    }

    function renderTagCloud() {
      const cloud = document.getElementById('tag-cloud');
      cloud.innerHTML = '';
      const allTags = [...new Set(tasks.flatMap(t => t.tags ?? []))].sort();
      allTags.forEach(tag => cloud.appendChild(buildTagPill(tag, true)));
    }

    const fmt = iso => iso
      ? new Date(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
      : '';

    function parseTags(str) {
      return [...new Set(str.split(',').map(s => s.trim().toLowerCase()).filter(Boolean))];
    }

    async function fetchTasks() {
      const res = await fetch(API);
      tasks = await res.json();
      renderTagCloud();
      render();
    }

    async function addTask(name, description, tags) {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, description, tags }),
      });
      tasks.unshift(await res.json());
      renderTagCloud();
      render();
    }

    async function toggleTask(id) {
      const t = tasks.find(t => t._id === id);
      const res = await fetch(`${API}/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed: !t.completedAt }),
      });
      const updated = await res.json();
      tasks = tasks.map(t => t._id === id ? updated : t);
      render();
    }

    async function saveEdit(id, name, description, tagsStr) {
      if (!name.trim()) return;
      const res = await fetch(`${API}/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, description, tags: parseTags(tagsStr) }),
      });
      const updated = await res.json();
      tasks = tasks.map(t => t._id === id ? updated : t);
      renderTagCloud();
      render();
    }

    async function deleteTask(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      tasks = tasks.filter(t => t._id !== id);
      renderTagCloud();
      render();
    }

    function visibleTasks() {
      return tasks.filter(t => {
        const statusOk = filter === 'all' ? true : filter === 'done' ? !!t.completedAt : !t.completedAt;
        const tagOk    = activeTags.size === 0 || [...activeTags].every(tag => (t.tags ?? []).includes(tag));
        return statusOk && tagOk;
      });
    }

    function render() {
      const visible = visibleTasks();
      const done    = visible.filter(t => t.completedAt).length;
      document.getElementById('stats').textContent =
        `${visible.length} tasks · ${done} done · ${visible.length - done} pending`;

      const list = document.getElementById('task-list');
      const tpl  = document.getElementById('task-tpl');
      list.innerHTML = '';

      if (!visible.length) {
        list.innerHTML = `<p class="text-center text-woodsmoke-500 text-sm py-16">No tasks here.</p>`;
        return;
      }

      for (const t of visible) {
        const node = tpl.content.cloneNode(true);
        const row  = node.querySelector('.task-row');

        if (t.completedAt) {
          row.classList.add('opacity-60');
          row.querySelector('.btn-check').classList.add('bg-green-500', 'border-green-500');
          row.querySelector('.check-icon').classList.remove('hidden');
          row.querySelector('.task-name').classList.add('line-through', 'text-woodsmoke-500');
          row.querySelector('.completed-label').classList.remove('hidden');
          row.querySelector('.completed-val').textContent = fmt(t.completedAt);
        }

        row.querySelector('.task-name').textContent   = t.name;
        row.querySelector('.created-val').textContent = fmt(t.createdAt);

        const descEl = row.querySelector('.task-desc');
        if (t.description) {
          descEl.textContent = t.description;
        } else {
          descEl.remove();
        }

        const tagsEl = row.querySelector('.task-tags');
        (t.tags ?? []).forEach(tag => tagsEl.appendChild(buildTagPill(tag, false)));

        row.querySelector('.btn-check').addEventListener('click',  () => toggleTask(t._id));
        row.querySelector('.btn-delete').addEventListener('click', () => deleteTask(t._id));

        row.querySelector('.btn-edit').addEventListener('click', () => {
          const nameEl     = row.querySelector('.task-name');
          const descEl     = row.querySelector('.task-desc');
          const tagsRow    = row.querySelector('.task-tags');
          const metaEl     = row.querySelector('.task-meta');
          const editZone   = row.querySelector('.edit-zone');
          const nameInput  = row.querySelector('.edit-input');
          const descInput  = row.querySelector('.edit-desc-input');
          const tagsInput  = row.querySelector('.edit-tags-input');

          [nameEl, descEl, tagsRow, metaEl].forEach(el => el?.classList.add('hidden'));
          editZone.classList.remove('hidden');
          nameInput.value = t.name;
          descInput.value = t.description ?? '';
          tagsInput.value = (t.tags ?? []).join(', ');
          nameInput.focus();

          const cancel = () => {
            [nameEl, descEl, tagsRow, metaEl].forEach(el => el?.classList.remove('hidden'));
            editZone.classList.add('hidden');
          };

          const save = () => saveEdit(t._id, nameInput.value, descInput.value, tagsInput.value);
          row.querySelector('.btn-save').onclick   = save;
          row.querySelector('.btn-cancel').onclick = cancel;
          nameInput.addEventListener('keydown', e => {
            if (e.key === 'Escape') cancel();
          });
        });

        list.appendChild(node);
      }
    }

    // Add form
    document.getElementById('add-form').addEventListener('submit', e => {
      e.preventDefault();
      const nameInput = document.getElementById('task-input');
      const descInput = document.getElementById('desc-input');
      const tagsInput = document.getElementById('tags-input');
      if (!nameInput.value.trim()) return;
      addTask(nameInput.value.trim(), descInput.value.trim(), parseTags(tagsInput.value));
      nameInput.value = '';
      descInput.value = '';
      tagsInput.value = '';
    });

    // Status filters
    document.getElementById('status-filters').addEventListener('click', e => {
      const btn = e.target.closest('[data-filter]');
      if (!btn) return;
      filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        const active = b === btn;
        b.classList.toggle('border-orchid-600', active);
        b.classList.toggle('text-orchid-400', active);
        b.classList.toggle('border-woodsmoke-800', !active);
        b.classList.toggle('text-woodsmoke-500', !active);
      });
      render();
    });

    fetchTasks();
  </script>
</body>
</html>
