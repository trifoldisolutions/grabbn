<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grabbn</title>
    <link rel="stylesheet" href="/tailwind/output.css">
    <style>
        html, body { height: 100%; overflow: hidden; }
        .link-row { cursor: pointer; transition: background 0.08s; }
        .link-row:hover { background: #f9fafb; }
        .link-row.selected { background: #fdf6fd; }
        .links-scroll { overflow-y: auto; flex: 1; }
        .text-clamp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .text-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        @keyframes grabbn-rescan-spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body class="bg-white font-sans text-[0.875rem] flex flex-col" style="height:100vh">

    <!-- Header -->
    <div class="flex items-center gap-2 px-3 py-2.5 border-b bg-white shrink-0">
        <div class="shrink-0 text-orchid-600" style="width:18px;height:18px">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
            </svg>
        </div>
        <div class="flex-1 min-w-0">
            <p class="text-xs font-semibold text-gray-900 text-clamp" id="sourceHost">Loading…</p>
            <p class="text-[10px] text-gray-400 text-clamp" id="sourcePathDisplay"></p>
        </div>
        <button id="rescanBtn" title="Rescan page" class="shrink-0 text-gray-400 hover:text-orchid-600 p-1 rounded transition-colors">
            <svg id="rescanIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
        </button>
        <button id="filterToggleBtn" title="Search" class="shrink-0 text-gray-400 hover:text-orchid-600 p-1 rounded transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </button>
        <button id="closeWidgetBtn" title="Close" class="shrink-0 text-gray-400 hover:text-gray-700 p-1 rounded transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>

    <!-- Search bar (hidden by default) -->
    <div id="searchBar" class="hidden px-3 py-2 border-b bg-gray-50 shrink-0">
        <input id="searchInput" type="text" placeholder="Filter links…"
            class="w-full text-xs rounded-md border border-gray-200 px-2.5 py-1.5 outline-none focus:border-orchid-400 bg-white">
    </div>

    <!-- Status bar -->
    <div id="statusBar" class="hidden px-3 py-1.5 text-[11px] font-medium border-b shrink-0"></div>

    <!-- Pages banner: shown when more pages are available -->
    <div id="pagesBanner" class="hidden px-3 py-1.5 border-b bg-amber-50 shrink-0 flex items-center gap-2">
        <svg class="shrink-0 text-amber-500" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
        </svg>
        <span class="text-[11px] text-amber-800 font-medium flex-1 min-w-0 truncate" id="pagesLabel"></span>
        <button id="loadPagesBtn" class="shrink-0 text-[11px] font-semibold text-amber-700 hover:text-amber-900 bg-amber-100 hover:bg-amber-200 px-2 py-0.5 rounded-md transition-colors">
            Load all
        </button>
    </div>

    <!-- Loading state (initial) -->
    <div id="loadingState" class="flex-1 flex flex-col items-center justify-center gap-2 text-gray-400">
        <svg class="animate-spin w-5 h-5 text-orchid-400" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 00-8 8h4z"/>
        </svg>
        <p class="text-xs">Fetching links…</p>
    </div>

    <!-- Auth prompt -->
    <div id="authPrompt" class="hidden flex-1 flex flex-col items-center justify-center gap-3 px-6 text-center">
        <div class="w-10 h-10 rounded-full bg-orchid-50 flex items-center justify-center text-orchid-500">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
            </svg>
        </div>
        <div>
            <p class="text-sm font-semibold text-gray-800">Sign in to save links</p>
            <p class="text-xs text-gray-400 mt-0.5">Create a free account to save links from any page into your buckets.</p>
        </div>
        <a href="/v2/login" target="_blank"
            class="px-4 py-2 rounded-lg bg-orchid-600 text-white text-xs font-semibold hover:bg-orchid-700 transition-colors">
            Sign in / Sign up
        </a>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center gap-2 px-4 text-center">
        <p class="text-sm font-medium text-gray-500">No links found</p>
        <p class="text-xs text-gray-400">This page didn't return any links.</p>
    </div>

    <!-- Links list -->
    <div id="linksList" class="hidden links-scroll divide-y divide-gray-50"></div>

    <!-- Footer -->
    <div id="footer" class="hidden border-t bg-white shrink-0 px-3 py-2.5 flex flex-col gap-y-2">
        <div class="flex items-center gap-2">
            <div class="flex items-center gap-2 flex-1 min-w-0">
                <span class="text-[11px] text-gray-500 shrink-0" id="selectedCount">0 selected</span>
                <button id="selectAllBtn" class="text-[11px] text-orchid-600 hover:text-orchid-700 shrink-0 font-medium">All</button>
                <button id="selectNoneBtn" class="text-[11px] text-gray-400 hover:text-gray-600 shrink-0">None</button>
            </div>
            <div id="bucketSelectWrapper" class="relative shrink-0">
                <button id="bucketSelectBtn" type="button"
                    class="text-xs border border-gray-200 rounded-md px-2 py-1 outline-none focus:border-orchid-400 bg-white flex items-center gap-1 min-w-[90px] max-w-[130px]">
                    <span id="bucketSelectLabel" class="truncate flex-1 text-left text-gray-400">Choose bucket…</span>
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-gray-400">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
                <div id="bucketSelectDropdown" class="hidden absolute bottom-full mb-1 right-0 bg-white border border-gray-200 rounded-md shadow-md z-50 min-w-full max-h-[150px] overflow-y-auto py-1">
                </div>
            </div>
            <button id="saveBtn" disabled
                class="px-3 py-1.5 rounded-lg bg-orchid-600 text-white text-xs font-semibold hover:bg-orchid-700 transition-colors shrink-0 disabled:opacity-40 disabled:cursor-not-allowed">
                Save
            </button>
        </div>
        <div id="saveStatus" class="hidden text-[11px]"></div>
    </div>

    <script>
        const API = '';  // same origin

        // Elements
        const loadingState  = document.getElementById('loadingState');
        const authPrompt    = document.getElementById('authPrompt');
        const emptyState    = document.getElementById('emptyState');
        const linksList     = document.getElementById('linksList');
        const footer        = document.getElementById('footer');
        const statusBar     = document.getElementById('statusBar');
        const pagesBanner   = document.getElementById('pagesBanner');
        const pagesLabel    = document.getElementById('pagesLabel');
        const loadPagesBtn  = document.getElementById('loadPagesBtn');
        const searchBar     = document.getElementById('searchBar');
        const searchInput   = document.getElementById('searchInput');
        const bucketSelectBtn      = document.getElementById('bucketSelectBtn');
        const bucketSelectLabel    = document.getElementById('bucketSelectLabel');
        const bucketSelectDropdown = document.getElementById('bucketSelectDropdown');
        let bucketValue = '';
        const saveBtn       = document.getElementById('saveBtn');
        const selectedCount = document.getElementById('selectedCount');
        const saveStatus    = document.getElementById('saveStatus');
        const sourceHostEl  = document.getElementById('sourceHost');
        const sourcePathEl  = document.getElementById('sourcePathDisplay');

        // State
        let allLinks        = [];
        let selectedUrls    = new Set();
        let existingHrefs   = new Set(); // hrefs already saved in the currently selected bucket
        let savedLinksCache = null;      // cached GET /api/links response (href → Set<bucketName>)
        let sourceUrl       = '';
        let filterText      = '';
        let maxPage         = 1;
        let currentPage     = 1;
        let pagesCollected  = 1;
        let anonId          = null; // resolved from popup session; avoids third-party cookie issues
        let anchorHref      = null; // range-selection anchor (href of last normally-clicked row)

        // Build fetch options, injecting X-Anonymous-Id when available
        function fetchOpts(extra = {}) {
            const headers = Object.assign({}, extra.headers);
            if (anonId) headers['X-Anonymous-Id'] = anonId;
            return Object.assign({ credentials: 'include' }, extra, { headers });
        }

        // --- Helpers ---

        function escHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function showStatus(msg, colorClass) {
            statusBar.textContent = msg;
            statusBar.className = `px-3 py-1.5 text-[11px] font-medium border-b shrink-0 ${colorClass}`;
            statusBar.classList.remove('hidden');
        }

        function hideStatus() {
            statusBar.classList.add('hidden');
        }

        function setView(view) {
            // view: 'loading' | 'auth' | 'empty' | 'list'
            loadingState.classList.toggle('hidden', view !== 'loading');
            authPrompt.classList.toggle('hidden',   view !== 'auth');
            emptyState.classList.toggle('hidden',   view !== 'empty');
            linksList.classList.toggle('hidden',    view !== 'list');
            footer.classList.toggle('hidden',       view !== 'list');
        }

        function updatePagesBanner() {
            if (maxPage <= currentPage) {
                pagesBanner.classList.add('hidden');
                return;
            }
            const remaining = maxPage - currentPage;
            pagesLabel.textContent = `${remaining} more page${remaining > 1 ? 's' : ''} detected (${currentPage + 1}–${maxPage})`;
            pagesBanner.classList.remove('hidden');
        }

        function buildPageUrls() {
            const urls = [];
            for (let n = currentPage + 1; n <= maxPage; n++) {
                try {
                    const u = new URL(sourceUrl);
                    u.searchParams.set('page', n);
                    urls.push(u.href);
                } catch {}
            }
            return urls;
        }

        function getFiltered() {
            if (!filterText) return allLinks;
            const q = filterText.toLowerCase();
            return allLinks.filter(l =>
                l.text.toLowerCase().includes(q) || l.href.toLowerCase().includes(q)
            );
        }

        function updateFooterCounts() {
            selectedCount.textContent = `${selectedUrls.size} selected`;
            saveBtn.disabled = selectedUrls.size === 0 || !bucketValue;
        }

        async function fetchSavedLinks() {
            if (savedLinksCache) return savedLinksCache;
            try {
                const res = await fetch(`${API}/api/links`, fetchOpts());
                if (!res.ok) return null;
                const data = await res.json();
                // Build map: href → Set of bucket names
                savedLinksCache = new Map();
                data.forEach(l => {
                    savedLinksCache.set(l.href, new Set(l.buckets || []));
                });
            } catch {}
            return savedLinksCache;
        }

        async function setBucketValue(val) {
            bucketValue = val;
            bucketSelectLabel.textContent = val || 'Choose bucket…';
            bucketSelectLabel.className = `truncate flex-1 text-left ${val ? 'text-gray-700' : 'text-gray-400'}`;

            if (val) {
                const cache = await fetchSavedLinks();
                existingHrefs = new Set();
                if (cache) {
                    cache.forEach((buckets, href) => {
                        if (buckets.has(val)) existingHrefs.add(href);
                    });
                }
                // Deselect any links that are already in this bucket
                existingHrefs.forEach(href => selectedUrls.delete(href));
                renderLinks();
            } else {
                existingHrefs = new Set();
            }

            updateFooterCounts();
        }

        function renderBucketOptions(names) {
            bucketSelectDropdown.innerHTML = '';
            names.forEach(name => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = `w-full text-left text-xs px-2.5 py-1.5 hover:bg-orchid-50 hover:text-orchid-700 truncate ${name === bucketValue ? 'text-orchid-600 font-medium' : 'text-gray-700'}`;
                item.textContent = name;
                item.addEventListener('click', () => {
                    setBucketValue(name);
                    bucketSelectDropdown.classList.add('hidden');
                });
                bucketSelectDropdown.appendChild(item);
            });
        }

        bucketSelectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isHidden = bucketSelectDropdown.classList.contains('hidden');
            bucketSelectDropdown.classList.toggle('hidden', !isHidden);
            if (isHidden) loadBuckets();
        });

        document.addEventListener('click', () => {
            bucketSelectDropdown.classList.add('hidden');
        });

        function renderLinks() {
            const filtered = getFiltered();
            linksList.innerHTML = '';

            if (filtered.length === 0) {
                linksList.innerHTML = '<p class="text-xs text-gray-400 text-center py-8">No matches for that filter.</p>';
                updateFooterCounts();
                return;
            }

            const frag = document.createDocumentFragment();

            filtered.forEach((link, i) => {
                const already = existingHrefs.has(link.href);
                const checked  = !already && selectedUrls.has(link.href);

                const row = document.createElement('label');
                row.className = `link-row flex items-start gap-2.5 px-3 py-2.5 ${checked ? 'selected' : ''} ${already ? 'cursor-default' : ''}`;
                row.innerHTML = `
                    <input type="checkbox" data-href="${escHtml(link.href)}"
                        class="mt-0.5 shrink-0 w-3.5 h-3.5 rounded accent-orchid-600 ${already ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}"
                        ${checked ? 'checked' : ''} ${already ? 'disabled' : ''}>
                    ${link.image ? `<img src="${escHtml(link.image)}" class="w-10 h-8 object-cover rounded shrink-0${already ? ' opacity-40' : ''}" onerror="this.remove()">` : ''}
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5">
                            <p class="text-xs font-medium text-clamp ${already ? 'text-gray-400' : 'text-gray-800'}">${escHtml(link.text)}</p>
                            ${already ? '<span class="shrink-0 text-[9px] font-semibold uppercase tracking-wide text-orchid-500 bg-orchid-50 rounded px-1 py-px">Saved</span>' : ''}
                        </div>
                        <p class="text-[10px] text-gray-400 text-clamp">${escHtml(link.href)}</p>
                    </div>
                `;

                const cb = row.querySelector('input[type=checkbox]');

                if (!already) {
                    row.addEventListener('click', (e) => {
                        if ((e.shiftKey || e.ctrlKey || e.metaKey) && anchorHref !== null) {
                            e.preventDefault();
                            const anchorIndex = filtered.findIndex(l => l.href === anchorHref);
                            if (anchorIndex !== -1) {
                                const from = Math.min(anchorIndex, i);
                                const to   = Math.max(anchorIndex, i);
                                for (let j = from; j <= to; j++) {
                                    if (!existingHrefs.has(filtered[j].href)) selectedUrls.add(filtered[j].href);
                                }
                                renderLinks();
                            }
                            return;
                        }
                    });

                    cb.addEventListener('change', () => {
                        if (cb.checked) {
                            selectedUrls.add(link.href);
                            row.classList.add('selected');
                        } else {
                            selectedUrls.delete(link.href);
                            row.classList.remove('selected');
                        }
                        anchorHref = link.href;
                        updateFooterCounts();
                    });
                }

                frag.appendChild(row);
            });

            linksList.appendChild(frag);
            updateFooterCounts();
        }

        // --- Auth & data fetching ---

        async function checkAuth() {
            try {
                const res = await fetch(`${API}/api/buckets`, fetchOpts());
                return res.ok;
            } catch {
                return false;
            }
        }

        let bucketsLoading = false;
        async function loadBuckets() {
            if (bucketsLoading) return;
            bucketsLoading = true;
            try {
                const res = await fetch(`${API}/api/buckets`, fetchOpts());
                if (!res.ok) return;
                const names = await res.json();
                const prev = bucketValue;
                // Restore previous selection if still valid, else pre-select the first
                if (prev && names.includes(prev)) {
                    await setBucketValue(prev);
                } else if (names.length > 0) {
                    await setBucketValue(names[0]);
                } else {
                    await setBucketValue('');
                }
                renderBucketOptions(names);
            } catch {} finally {
                bucketsLoading = false;
            }
        }

        // --- Load session from URL token ---

        async function loadSession() {
            const token = new URLSearchParams(window.location.search).get('session');
            if (!token) {
                sourceHostEl.textContent = 'No session';
                setView('empty');
                return;
            }

            try {
                const res = await fetch(`/api/popup-session?token=${encodeURIComponent(token)}`, { credentials: 'include' });
                if (!res.ok) {
                    sourceHostEl.textContent = 'Session expired';
                    setView('empty');
                    return;
                }

                const { links, sourceUrl: src, maxPage: mp, currentPage: cp, pagesCollected: pc, anonymousId: sid } = await res.json();
                if (sid) anonId = sid;
                sourceUrl      = src;
                maxPage        = mp || 1;
                currentPage    = cp || 1;
                pagesCollected = Math.max(Number(pc) || 1, 1);

                try {
                    const u = new URL(src);
                    sourceHostEl.textContent = u.hostname;
                    const pathStr = (u.pathname + (u.search || '')).slice(0, 70);
                    sourcePathEl.textContent = pagesCollected > 1
                        ? `${pagesCollected} pages · ${pathStr}`
                        : pathStr;
                    sourcePathEl.title = src;
                } catch {
                    sourceHostEl.textContent = String(src).slice(0, 60);
                }

                const authed = await checkAuth();
                if (!authed) {
                    setView('auth');
                    return;
                }

                await loadBuckets();

                if (!links || links.length === 0) {
                    setView('empty');
                    return;
                }

                allLinks = links;
                // Persist parsed links so the bucket creation modal can import them via the Refresh button
                try { localStorage.setItem('grabbn:parsedLinks', JSON.stringify(links)); } catch (_) {}
                setView('list');
                renderLinks();
                updatePagesBanner();

            } catch {
                sourceHostEl.textContent = 'Error loading links';
                setView('empty');
            }
        }

        loadSession();

        // --- Save ---

        saveBtn.addEventListener('click', async () => {
            const bucket = bucketValue;
            if (!bucket || selectedUrls.size === 0) return;

            const linksToSave = allLinks
                .filter(l => selectedUrls.has(l.href))
                .map(l => ({ href: l.href, text: l.text, image: l.image || null, sourceUrl }));

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving…';
            saveStatus.classList.add('hidden');

            try {
                const res = await fetch(`${API}/api/links`, fetchOpts({
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ links: linksToSave, buckets: [bucket] })
                }));

                if (res.ok) {
                    const n = linksToSave.length;
                    saveStatus.textContent = `✓ ${n} link${n !== 1 ? 's' : ''} saved to "${bucket}"`;
                    saveStatus.className = 'text-[11px] text-green-600';
                    saveStatus.classList.remove('hidden');
                    selectedUrls.clear();
                    // Invalidate cache so newly saved links show as disabled immediately
                    savedLinksCache = null;
                    await setBucketValue(bucket);
                    setTimeout(() => saveStatus.classList.add('hidden'), 3000);
                    // Clear the window.name accumulator on the parent page so the
                    // next bookmarklet click starts a fresh collection session.
                    if (window.parent !== window) {
                        window.parent.postMessage('grabbn-reset', '*');
                    }
                    pagesCollected = 1;
                } else {
                    const err = await res.json().catch(() => ({}));
                    saveStatus.textContent = err.error || 'Failed to save links.';
                    saveStatus.className = 'text-[11px] text-red-500';
                    saveStatus.classList.remove('hidden');
                }
            } catch {
                saveStatus.textContent = 'Network error. Please try again.';
                saveStatus.className = 'text-[11px] text-red-500';
                saveStatus.classList.remove('hidden');
            }

            saveBtn.textContent = 'Save';
            updateFooterCounts();
        });

        // --- Filter / search ---

        document.getElementById('filterToggleBtn').addEventListener('click', () => {
            const hidden = searchBar.classList.toggle('hidden');
            if (!hidden) {
                searchInput.focus();
            } else {
                searchInput.value = '';
                filterText = '';
                renderLinks();
            }
        });

        searchInput.addEventListener('input', () => {
            filterText = searchInput.value.trim();
            renderLinks();
        });

        // --- Select all / none ---

        document.getElementById('selectAllBtn').addEventListener('click', () => {
            getFiltered().forEach(l => { if (!existingHrefs.has(l.href)) selectedUrls.add(l.href); });
            renderLinks();
        });

        document.getElementById('selectNoneBtn').addEventListener('click', () => {
            selectedUrls.clear();
            renderLinks();
        });


        // Also re-fetch when the popup window itself regains focus (e.g. user switches
        // back after auto-saving a draft bucket in the main app tab).
        window.addEventListener('focus', () => { loadBuckets(); });

        // --- Rescan button ---
        const rescanBtn  = document.getElementById('rescanBtn');
        const rescanIcon = document.getElementById('rescanIcon');
        let rescanSpinning = false;

        rescanBtn.addEventListener('click', () => {
            if (rescanSpinning) return;
            rescanSpinning = true;
            rescanIcon.style.animation = 'grabbn-rescan-spin .7s linear infinite';
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'grabbn-rescan' }, '*');
            }
            // Auto-stop spinner after 3s if no reply
            setTimeout(() => {
                rescanSpinning = false;
                rescanIcon.style.animation = '';
            }, 3000);
        });

        // --- Close button ---
        document.getElementById('closeWidgetBtn').addEventListener('click', () => {
            if (window.parent !== window) {
                window.parent.postMessage('grabbn-close', '*');
            } else {
                window.close();
            }
        });

        // --- Pagination: load all pages ---

        loadPagesBtn.addEventListener('click', () => {
            const urls = buildPageUrls();
            if (!urls.length) return;

            loadPagesBtn.disabled = true;
            loadPagesBtn.textContent = `Loading…`;
            pagesLabel.textContent   = `Fetching page ${currentPage + 1} of ${maxPage}…`;

            // Ask the bookmarklet (running in the outer page) to fetch each URL
            window.parent.postMessage({ type: 'grabbn-fetch-pages', urls }, '*');
        });

        // --- Receive fetched-page link batches from the bookmarklet relay ---

        window.addEventListener('message', (e) => {
            if (!e.data) return;

            if (e.data.type === 'grabbn-rescan-result') {
                rescanSpinning = false;
                rescanIcon.style.animation = '';
                const { links: newLinks = [] } = e.data;
                if (newLinks.length) {
                    const existing = new Set(allLinks.map(l => l.href));
                    newLinks.forEach(l => { if (!existing.has(l.href)) allLinks.push(l); });
                    if (allLinks.length > 0 && linksList.classList.contains('hidden')) setView('list');
                    renderLinks();
                    showStatus(`+${newLinks.length} new link${newLinks.length !== 1 ? 's' : ''} found`, 'text-green-700 bg-green-50');
                    setTimeout(hideStatus, 2500);
                } else {
                    showStatus('No new links found on this page', 'text-gray-500 bg-gray-50');
                    setTimeout(hideStatus, 2000);
                }
                return;
            }

            if (e.data.type !== 'grabbn-page-links') return;

            const { links: newLinks = [], pageUrl, index, total, error } = e.data;

            if (!error && newLinks.length) {
                // Deduplicate before merging
                const existing = new Set(allLinks.map(l => l.href));
                newLinks.forEach(l => { if (!existing.has(l.href)) { allLinks.push(l); existing.add(l.href); } });
                renderLinks();
            }

            const doneCount = index + 1;

            if (doneCount >= total) {
                // All pages finished
                pagesBanner.classList.add('hidden');
                showStatus(`All ${total + 1} pages loaded — ${allLinks.length} links total`, 'text-green-700 bg-green-50');
                setTimeout(hideStatus, 3000);
            } else {
                // Still in progress — show which page we just got
                try {
                    const pageNum = new URL(pageUrl).searchParams.get('page');
                    pagesLabel.textContent = `Fetching page ${pageNum} of ${maxPage}…`;
                } catch {}
            }
        });

    </script>
</body>

</html>
