<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grabbn</title>
    <link rel="stylesheet" href="/tailwind/output.css">
    <style>
        html, body { height: 100%; overflow: hidden; margin: 0; }
        .link-row { cursor: pointer; transition: background 0.08s; }
        .link-row:hover { background: #f9fafb; }
        .link-row.selected { background: #fdf6fd; }
        .links-scroll { overflow-y: auto; flex: 1; min-height: 0; }
        .text-clamp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>

<body class="bg-white font-sans text-[0.875rem]" style="height:100vh;display:flex;flex-direction:column;">

    <!-- ── VIEW A : idle / picking ───────────────────────────────── -->
    <div id="viewIdle" style="display:none;" class="flex flex-col gap-3 p-3">
        <!-- header -->
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="text-orchid-600 shrink-0" viewBox="0 0 24 24" width="15" height="15" fill="none">
                    <path fill="currentColor" d="M15.5 5a2.5 2.5 0 0 1 2.461 2.058A2.5 2.5 0 0 1 21 9.5V12a8 8 0 0 1-8 8h-.674a8 8 0 0 1-7.155-4.422L2.329 9.894c-.36-.72-.093-1.683.747-2.028c1.043-.427 2.034-.507 3.055.012q.443.227.869.584V7.5a2.5 2.5 0 0 1 3.388-2.338a2.498 2.498 0 0 1 4.224 0A2.5 2.5 0 0 1 15.5 5"/>
                </svg>
                <span class="text-xs font-semibold tracking-wide text-gray-600 uppercase">Grabbn</span>
            </div>
            <button id="closeBtn"
                class="flex items-center justify-center text-gray-400 hover:text-gray-600 p-0.5 rounded transition-colors">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <!-- pick element -->
        <button id="pickElementBtn"
            class="w-full flex items-center justify-center gap-1.5 text-xs font-medium border border-gray-200 rounded-md h-12 hover:border-orchid-400 hover:text-orchid-600 transition-colors text-gray-700">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/>
                <line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/>
            </svg>
            Pick Element
        </button>

        <!-- siblings toggle -->
        <div class="flex items-center justify-between gap-3 px-0.5">
            <div class="flex flex-col gap-0.5 min-w-0">
                <span class="text-xs text-gray-500">Highlight Siblings</span>
                <span class="text-[11px] text-gray-400 leading-snug">Selects matching card elements</span>
            </div>
            <button id="siblingsToggle" role="switch" data-active="true"
                style="width:36px;height:20px;border-radius:10px;position:relative;flex-shrink:0;"
                class="bg-orchid-600 transition-colors focus:outline-none">
                <span id="siblingsThumb"
                    style="position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:white;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform 0.15s;transform:translateX(16px);"></span>
            </button>
        </div>

        <!-- grab links (hidden until items are checked) -->
        <button id="grabLinksBtn" disabled style="display:none;"
            class="w-full flex items-center justify-center text-xs font-semibold rounded-md h-12 bg-orchid-600 text-white hover:bg-orchid-700 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
            Grab Links
        </button>

        <!-- bulk-select hint -->
        <p id="shiftHint" style="display:none;" class="text-[11px] text-gray-400 leading-snug px-0.5">
            <span class="font-semibold text-gray-500">Tip:</span> Check the first item, hold <span class="font-semibold text-gray-500">Shift</span>, then check the last to select the whole range.
        </p>
    </div>

    <!-- ── VIEW B : crosshair mode ───────────────────────────────── -->
    <div id="viewCrosshair" style="display:none;" class="p-3">
        <button id="abortBtn"
            class="w-full flex items-center justify-center gap-1.5 text-xs font-medium border border-red-200 text-red-600 rounded-md py-2 hover:bg-red-50 transition-colors">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            Abort&nbsp;&nbsp;(Esc)
        </button>
    </div>

    <!-- ── VIEW C : review + save ────────────────────────────────── -->
    <div id="viewReview" style="display:none;height:100vh;flex-direction:column;" class="flex">
        <!-- header -->
        <div class="flex items-center gap-2 px-3 py-2.5 border-b bg-white shrink-0">
            <svg class="shrink-0 text-orchid-600" viewBox="0 0 24 24" fill="currentColor" width="15" height="15">
                <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
            </svg>
            <p id="reviewTitle" class="text-xs font-semibold text-gray-900 flex-1">0 items grabbed</p>
            <button id="backBtn"
                class="flex items-center justify-center text-xs text-orchid-600 hover:text-orchid-700 font-medium shrink-0">
                ← Back
            </button>
            <button id="closeBtn2"
                class="flex items-center justify-center shrink-0 text-gray-400 hover:text-gray-700 p-1 rounded transition-colors">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <!-- items list -->
        <div id="linksList" class="links-scroll divide-y divide-gray-50"></div>

        <!-- footer -->
        <div class="border-t bg-white shrink-0 px-3 py-2.5 flex flex-col gap-y-2">
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-2 flex-1 min-w-0">
                    <span id="selectedCount" class="text-xs text-gray-500 shrink-0">0 selected</span>
                    <button id="selectAllBtn"
                        class="flex items-center justify-center text-xs text-orchid-600 hover:text-orchid-700 shrink-0 font-medium">
                        All
                    </button>
                    <button id="selectNoneBtn"
                        class="flex items-center justify-center text-xs text-gray-400 hover:text-gray-600 shrink-0">
                        None
                    </button>
                </div>

                <!-- multi-select bucket dropdown -->
                <div id="bucketSelectWrapper" class="relative shrink-0">
                    <button id="bucketSelectBtn" type="button"
                        class="flex items-center justify-center text-xs border border-gray-200 rounded-md px-2 py-1 bg-white gap-1 min-w-[90px] max-w-[140px]">
                        <span id="bucketSelectLabel" class="truncate flex-1 text-left text-gray-400">Bucket…</span>
                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-gray-400">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <div id="bucketSelectDropdown"
                        class="hidden absolute bottom-full mb-1 right-0 bg-white border border-gray-200 rounded-md shadow-md z-50 min-w-full max-h-[160px] overflow-y-auto py-1">
                    </div>
                </div>

                <button id="saveBtn" disabled
                    class="flex items-center justify-center px-3 py-1.5 rounded-md bg-orchid-600 text-white text-xs font-semibold hover:bg-orchid-700 transition-colors shrink-0 disabled:opacity-40 disabled:cursor-not-allowed">
                    Save
                </button>
            </div>
            <div id="saveStatus" class="hidden text-xs"></div>
        </div>
    </div>

    <!-- ── AUTH PROMPT ────────────────────────────────────────────── -->
    <div id="authPrompt" style="display:none;" class="flex flex-col items-center justify-center gap-3 px-4 text-center py-6">
        <div class="w-9 h-9 rounded-full bg-orchid-50 flex items-center justify-center text-orchid-500">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
            </svg>
        </div>
        <div>
            <p class="text-xs font-semibold text-gray-800">Sign in to grab links</p>
            <p class="text-xs text-gray-400 mt-0.5">Create a free account to save links into your buckets.</p>
        </div>
        <a href="/v2/login" target="_blank"
            class="flex items-center justify-center px-4 py-2 rounded-md bg-orchid-600 text-white text-xs font-semibold hover:bg-orchid-700 transition-colors">
            Sign in / Sign up
        </a>
    </div>

    <script>
        // ── url params ──────────────────────────────────────────────
        const params    = new URLSearchParams(window.location.search);
        const sourceUrl = params.get('source') || '';
        const anonId    = params.get('anon')   || '';

        // ── state ───────────────────────────────────────────────────
        let allItems       = [];
        let selectedUrls   = new Set();
        let selectedBuckets = new Set();
        let bucketsLoaded  = [];
        let bucketsLoading = false;
        let anchorHref     = null;
        let siblingsActive = true;
        let checkedCount   = 0;

        // ── element refs ────────────────────────────────────────────
        const viewIdle        = document.getElementById('viewIdle');
        const viewCrosshair   = document.getElementById('viewCrosshair');
        const viewReview      = document.getElementById('viewReview');
        const authPromptEl    = document.getElementById('authPrompt');

        const pickElementBtn  = document.getElementById('pickElementBtn');
        const siblingsToggle  = document.getElementById('siblingsToggle');
        const grabLinksBtn    = document.getElementById('grabLinksBtn');
        const shiftHint       = document.getElementById('shiftHint');
        const closeBtn        = document.getElementById('closeBtn');
        const abortBtn        = document.getElementById('abortBtn');
        const backBtn         = document.getElementById('backBtn');
        const closeBtn2       = document.getElementById('closeBtn2');
        const reviewTitle     = document.getElementById('reviewTitle');
        const linksList       = document.getElementById('linksList');
        const selectedCount   = document.getElementById('selectedCount');
        const selectAllBtn    = document.getElementById('selectAllBtn');
        const selectNoneBtn   = document.getElementById('selectNoneBtn');
        const bucketSelectBtn      = document.getElementById('bucketSelectBtn');
        const bucketSelectLabel    = document.getElementById('bucketSelectLabel');
        const bucketSelectDropdown = document.getElementById('bucketSelectDropdown');
        const saveBtn         = document.getElementById('saveBtn');
        const saveStatus      = document.getElementById('saveStatus');

        // ── helpers ─────────────────────────────────────────────────
        function fetchOpts(extra = {}) {
            const headers = Object.assign({}, extra.headers);
            if (anonId) headers['X-Anonymous-Id'] = anonId;
            return Object.assign({ credentials: 'include' }, extra, { headers });
        }

        function escHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function postToParent(msg) {
            if (window.parent !== window) window.parent.postMessage(msg, '*');
        }

        // ── view management ─────────────────────────────────────────
        // Sizes sent to bookmarklet (content height only; drag bar added by IIFE)
        const VIEW_SIZES = {
            idle:         { w: 280, h: 252 },
            idle_compact: { w: 280, h: 148 },
            crosshair: { w: 240, h: 62  },
            review:    { w: 380, h: 540 },
            auth:      { w: 280, h: 210 },
        };

        function showView(name) {
            viewIdle.style.display      = 'none';
            viewCrosshair.style.display = 'none';
            viewReview.style.display    = 'none';
            authPromptEl.style.display  = 'none';

            if (name === 'idle') {
                viewIdle.style.display = 'flex';
                viewIdle.style.flexDirection = 'column';
            } else if (name === 'crosshair') {
                viewCrosshair.style.display = 'block';
            } else if (name === 'review') {
                viewReview.style.display = 'flex';
            } else if (name === 'auth') {
                authPromptEl.style.display = 'flex';
            }

            const sizeKey = name === 'idle'
                ? (grabLinksBtn.style.display === 'none' ? 'idle_compact' : 'idle')
                : name;
            const s = VIEW_SIZES[sizeKey] || VIEW_SIZES.idle_compact;
            postToParent({ type: 'grabbn-resize', width: s.w, height: s.h });
        }

        // ── siblings toggle ─────────────────────────────────────────
        const siblingsThumb = document.getElementById('siblingsThumb');
        siblingsToggle.addEventListener('click', () => {
            siblingsActive = !siblingsActive;
            siblingsToggle.dataset.active = String(siblingsActive);
            if (siblingsActive) {
                siblingsToggle.classList.remove('bg-gray-200');
                siblingsToggle.classList.add('bg-orchid-600');
                siblingsThumb.style.transform = 'translateX(16px)';
            } else {
                siblingsToggle.classList.remove('bg-orchid-600');
                siblingsToggle.classList.add('bg-gray-200');
                siblingsThumb.style.transform = 'translateX(0)';
            }
            postToParent({ type: 'grabbn-toggle-siblings', active: siblingsActive });
        });

        // ── pick element ────────────────────────────────────────────
        pickElementBtn.addEventListener('click', () => {
            showView('crosshair');
            postToParent({ type: 'grabbn-enter-pick' });
        });

        // ── abort ───────────────────────────────────────────────────
        function abortPickMode() {
            postToParent({ type: 'grabbn-abort-pick' });
            showView('idle');
        }

        abortBtn.addEventListener('click', abortPickMode);

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && viewCrosshair.style.display !== 'none') {
                e.preventDefault();
                abortPickMode();
            }
        });

        // ── close ───────────────────────────────────────────────────
        function closeWidget() { postToParent('grabbn-close'); }
        closeBtn.addEventListener('click', closeWidget);
        closeBtn2.addEventListener('click', closeWidget);

        // ── back ────────────────────────────────────────────────────
        backBtn.addEventListener('click', () => showView('idle'));

        // ── grab links ──────────────────────────────────────────────
        grabLinksBtn.addEventListener('click', () => {
            postToParent({ type: 'grabbn-get-selected' });
        });

        // ── bucket multi-select ─────────────────────────────────────
        function updateBucketLabel() {
            if (selectedBuckets.size === 0) {
                bucketSelectLabel.textContent = 'Bucket…';
                bucketSelectLabel.className = 'truncate flex-1 text-left text-gray-400';
            } else if (selectedBuckets.size === 1) {
                bucketSelectLabel.textContent = [...selectedBuckets][0];
                bucketSelectLabel.className = 'truncate flex-1 text-left text-gray-700';
            } else {
                bucketSelectLabel.textContent = `${selectedBuckets.size} buckets`;
                bucketSelectLabel.className = 'truncate flex-1 text-left text-gray-700';
            }
        }

        function renderBucketOptions() {
            bucketSelectDropdown.innerHTML = '';
            bucketsLoaded.forEach(name => {
                const item = document.createElement('label');
                item.className = 'flex items-center gap-2 w-full text-xs px-2.5 py-1.5 hover:bg-orchid-50 cursor-pointer';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'w-3 h-3 shrink-0 accent-orchid-600';
                cb.checked = selectedBuckets.has(name);
                const span = document.createElement('span');
                span.className = `truncate ${selectedBuckets.has(name) ? 'text-orchid-700 font-medium' : 'text-gray-700'}`;
                span.textContent = name;
                cb.addEventListener('change', () => {
                    if (cb.checked) selectedBuckets.add(name);
                    else selectedBuckets.delete(name);
                    updateBucketLabel();
                    updateSaveBtn();
                    renderBucketOptions();
                });
                item.appendChild(cb);
                item.appendChild(span);
                bucketSelectDropdown.appendChild(item);
            });
        }

        bucketSelectBtn.addEventListener('click', e => {
            e.stopPropagation();
            const hidden = bucketSelectDropdown.classList.contains('hidden');
            bucketSelectDropdown.classList.toggle('hidden', !hidden);
            if (hidden) loadBuckets();
        });

        document.addEventListener('click', () => bucketSelectDropdown.classList.add('hidden'));

        function updateSaveBtn() {
            saveBtn.disabled = selectedUrls.size === 0 || selectedBuckets.size === 0;
        }

        // ── render review list ──────────────────────────────────────
        function renderLinks() {
            linksList.innerHTML = '';
            const frag = document.createDocumentFragment();

            allItems.forEach((item, i) => {
                const checked = selectedUrls.has(item.href);
                const row = document.createElement('label');
                row.className = `link-row flex items-start gap-2.5 px-3 py-2.5 ${checked ? 'selected' : ''}`;
                row.innerHTML = `
                    <input type="checkbox" data-href="${escHtml(item.href)}"
                        class="mt-0.5 shrink-0 w-3.5 h-3.5 rounded accent-orchid-600 cursor-pointer"
                        ${checked ? 'checked' : ''}>
                    ${item.image
                        ? `<img src="${escHtml(item.image)}" class="w-10 h-8 object-cover rounded-md shrink-0" onerror="this.remove()">`
                        : ''}
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-medium text-gray-800 text-clamp">${escHtml(item.text || item.href)}</p>
                        <p class="text-xs text-gray-400 text-clamp">${escHtml(item.href)}</p>
                    </div>`;

                const cb = row.querySelector('input[type=checkbox]');

                row.addEventListener('click', e => {
                    if (e.shiftKey && anchorHref !== null) {
                        e.preventDefault();
                        const ai = allItems.findIndex(l => l.href === anchorHref);
                        if (ai !== -1) {
                            const from = Math.min(ai, i), to = Math.max(ai, i);
                            for (let j = from; j <= to; j++) selectedUrls.add(allItems[j].href);
                            renderLinks();
                        }
                        return;
                    }
                });

                cb.addEventListener('change', () => {
                    if (cb.checked) { selectedUrls.add(item.href); row.classList.add('selected'); }
                    else            { selectedUrls.delete(item.href); row.classList.remove('selected'); }
                    anchorHref = item.href;
                    updateCountLabel();
                    updateSaveBtn();
                });

                frag.appendChild(row);
            });

            linksList.appendChild(frag);
            updateCountLabel();
        }

        function updateCountLabel() {
            selectedCount.textContent = `${selectedUrls.size} selected`;
        }

        selectAllBtn.addEventListener('click', () => {
            allItems.forEach(l => selectedUrls.add(l.href));
            renderLinks(); updateSaveBtn();
        });

        selectNoneBtn.addEventListener('click', () => {
            selectedUrls.clear();
            renderLinks(); updateSaveBtn();
        });

        // ── load buckets ────────────────────────────────────────────
        async function loadBuckets() {
            if (bucketsLoading) return;
            bucketsLoading = true;
            try {
                const res = await fetch('/api/buckets', fetchOpts());
                if (!res.ok) return;
                bucketsLoaded = await res.json();
                // Pre-select first bucket if none selected yet
                if (selectedBuckets.size === 0 && bucketsLoaded.length > 0) {
                    selectedBuckets.add(bucketsLoaded[0]);
                    updateBucketLabel();
                    updateSaveBtn();
                }
                renderBucketOptions();
            } catch {} finally { bucketsLoading = false; }
        }

        // ── save ────────────────────────────────────────────────────
        saveBtn.addEventListener('click', async () => {
            if (selectedUrls.size === 0 || selectedBuckets.size === 0) return;

            const linksToSave = allItems
                .filter(l => selectedUrls.has(l.href))
                .map(l => ({ href: l.href, text: l.text, image: l.image || null, sourceUrl }));

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving…';
            saveStatus.classList.add('hidden');

            try {
                const res = await fetch('/api/links', fetchOpts({
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ links: linksToSave, buckets: [...selectedBuckets] })
                }));

                if (res.ok) {
                    const n = linksToSave.length;
                    const bNames = [...selectedBuckets].join(', ');
                    saveStatus.textContent = `✓ ${n} link${n !== 1 ? 's' : ''} saved to ${bNames}`;
                    saveStatus.className = 'text-xs text-green-600';
                    saveStatus.classList.remove('hidden');
                    selectedUrls.clear();
                    renderLinks();
                    setTimeout(() => saveStatus.classList.add('hidden'), 3000);
                } else {
                    const err = await res.json().catch(() => ({}));
                    saveStatus.textContent = err.error || 'Failed to save.';
                    saveStatus.className = 'text-xs text-red-500';
                    saveStatus.classList.remove('hidden');
                }
            } catch {
                saveStatus.textContent = 'Network error. Try again.';
                saveStatus.className = 'text-xs text-red-500';
                saveStatus.classList.remove('hidden');
            }

            saveBtn.textContent = 'Save';
            updateSaveBtn();
        });

        // ── messages from bookmarklet parent ─────────────────────────
        window.addEventListener('message', e => {
            const d = e.data;
            if (!d) return;

            // element was anchored → return to idle
            if (d.type === 'grabbn-element-picked') {
                showView('idle');
                return;
            }

            // Esc / abort from parent → return to idle
            if (d.type === 'grabbn-pick-aborted') {
                showView('idle');
                return;
            }

            // checkbox state changed in page
            if (d.type === 'grabbn-check-change') {
                checkedCount = d.count;
                const hasItems = checkedCount > 0;
                grabLinksBtn.disabled = !hasItems;
                grabLinksBtn.style.display = hasItems ? '' : 'none';
                shiftHint.style.display = hasItems ? '' : 'none';
                if (viewIdle.style.display !== 'none') {
                    postToParent({ type: 'grabbn-resize', width: 280, height: hasItems ? VIEW_SIZES.idle.h : VIEW_SIZES.idle_compact.h });
                }
                return;
            }

            // parent sent extracted items → show review
            if (d.type === 'grabbn-selected-items') {
                allItems = d.items || [];
                selectedUrls = new Set(allItems.map(i => i.href)); // pre-check all
                anchorHref = null;
                reviewTitle.textContent = `${allItems.length} item${allItems.length !== 1 ? 's' : ''} grabbed`;
                renderLinks();
                loadBuckets();
                showView('review');
                return;
            }
        });

        // ── init ─────────────────────────────────────────────────────
        (async function init() {
            try {
                const res = await fetch('/api/buckets', fetchOpts());
                if (!res.ok) { showView('auth'); return; }
                bucketsLoaded = await res.json();
                if (selectedBuckets.size === 0 && bucketsLoaded.length > 0) {
                    selectedBuckets.add(bucketsLoaded[0]);
                    updateBucketLabel();
                }
            } catch { showView('auth'); return; }
            showView('idle');
            postToParent({ type: 'grabbn-toggle-siblings', active: siblingsActive });
        })();
    </script>
</body>
</html>
